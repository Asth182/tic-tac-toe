<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic Tac Toe</title>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      overflow-y: scroll;
      scrollbar-gutter: stable;

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f1220;
      color: #e9ecff;
    }

    .wrap {
      width: 420px;
      max-width: 92vw;
      display: grid;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.4px;
      opacity: 0.95;
      text-align: center;
    }

    .status {
      padding: 10px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    label {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 14px;
    }

    button, select {
      font: inherit;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: #e9ecff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover, select:hover { background: rgba(255,255,255,0.12); }
    button:focus, select:focus { outline: none; }

    .board {
      width: 360px;
      height: 360px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.10);
      margin-inline: auto;
grid-template-rows: repeat(3, 1fr);

    }

    .cell {
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      display: grid;
      place-items: center;
      font-size: 64px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
      touch-action: manipulation;
width: 100%;
height: 100%;

    }

    .cell:hover { background: rgba(255,255,255,0.10); }
    .cell:active { transform: none; }

    .cell.winner {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.45);
    }

    .small {
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Tic Tac Toe</h1>

    <div class="status" id="status">Turno di: <b id="turn">X</b></div>

    <div class="row">
      <label>
        Modalità:
        <select id="mode">
          <option value="pvp">PvP (2 giocatori)</option>
          <option value="cpu">CPU (contro computer)</option>
        </select>
      
<label>
  Inizia:
  <select id="starter">
    <option value="X" selected>Tu (X)</option>
    <option value="O">CPU (O)</option>
  </select>
</label>

      <label>
        Difficoltà:
        <select id="difficulty">
          <option value="easy">Facile</option>
          <option value="normal" selected>Normale</option>
          <option value="hard">Impossibile</option>
        </select>
      </label>

      <div class="small">v1.3</div>
    </div>

    <div class="board" id="board" aria-label="Tic Tac Toe board"></div>

    <div class="status" id="score">
      Punteggio — X: <b id="sx">0</b> | O: <b id="so">0</b> | Pareggi: <b id="sd">0</b>
    </div>

    <div class="row">
      <button id="reset">Ricomincia</button>
<button id="resetScore">Azzera punteggio</button>

      <div class="small">Browser</div>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const turnEl = document.getElementById("turn");
    const resetBtn = document.getElementById("reset");
    const modeEl = document.getElementById("mode");
    const difficultyEl = document.getElementById("difficulty");
const starterEl = document.getElementById("starter");
const resetScoreBtn = document.getElementById("resetScore");
resetScoreBtn.addEventListener("click", () => {
  scoreX = 0;
  scoreO = 0;
  scoreD = 0;
  renderScore();
});


    const sxEl = document.getElementById("sx");
    const soEl = document.getElementById("so");
    const sdEl = document.getElementById("sd");

    // Stato del gioco
    let board = Array(9).fill(null);
    let currentPlayer = "X";
    let gameOver = false;
    let winningCells = [];

    // Score
    let scoreX = 0;
    let scoreO = 0;
    let scoreD = 0;

    function renderScore() {
      sxEl.textContent = scoreX;
      soEl.textContent = scoreO;
      sdEl.textContent = scoreD;
    }

    const winLines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function emptyIndexes() {
      const res = [];
      for (let i = 0; i < 9; i++) if (board[i] === null) res.push(i);
      return res;
    }

    function findWinningMove(player) {
      for (const [a,b,c] of winLines) {
        const line = [a,b,c];
        const vals = line.map(i => board[i]);
        const countPlayer = vals.filter(v => v === player).length;
        const countEmpty = vals.filter(v => v === null).length;
        if (countPlayer === 2 && countEmpty === 1) {
          const emptyPos = line[vals.indexOf(null)];
          return emptyPos;
        }
      }
      return null;
    }

    function cpuPickMove() {
      const empties = emptyIndexes();
      const difficulty = difficultyEl.value;

      // Facile: random
      if (difficulty === "easy") {
        return empties[Math.floor(Math.random() * empties.length)];
      }

      // Normale: a volte random
      if (difficulty === "normal") {
        if (Math.random() < 0.4) {
          return empties[Math.floor(Math.random() * empties.length)];
        }
      }

      // Hard: smart
      let move = findWinningMove("O");
      if (move !== null) return move;

      move = findWinningMove("X");
      if (move !== null) return move;

      if (board[4] === null) return 4;

      const corners = [0,2,6,8].filter(i => board[i] === null);
      if (corners.length) return corners[Math.floor(Math.random() * corners.length)];

      const sides = [1,3,5,7].filter(i => board[i] === null);
      if (sides.length) return sides[Math.floor(Math.random() * sides.length)];

      return empties[Math.floor(Math.random() * empties.length)];
    }

    function doCpuMoveIfNeeded() {
      if (modeEl.value !== "cpu") return;
      if (gameOver) return;
      if (currentPlayer !== "O") return;

      const idx = cpuPickMove();
      if (idx === undefined || idx === null) return;

      setTimeout(() => {
        if (modeEl.value !== "cpu") return;
        if (!gameOver && board[idx] === null && currentPlayer === "O") {
          onCellClick(idx, true);

        }
      }, 220);
    }

    function render() {
      boardEl.innerHTML = "";

      board.forEach((value, i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = value ?? "";
        if (winningCells.includes(i)) cell.classList.add("winner");

        // evita selection/focus strani
        cell.addEventListener("mousedown", (e) => e.preventDefault());
        cell.addEventListener("click", () => onCellClick(i));

        boardEl.appendChild(cell);
      });

      turnEl.textContent = currentPlayer;
    }

    function checkWinner() {
      for (const line of winLines) {
        const [a,b,c] = line;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return line;
        }
      }
      return null;
    }

    function isDraw() {
      return board.every(cell => cell !== null);
    }

    function setStatus(text) {
      statusEl.innerHTML = text;
    }

   function onCellClick(index, isCpu = false) {

     if (gameOver) return;
      if (board[index] !== null) return;

      // in CPU: l'umano è X, la CPU è O
      if (modeEl.value === "cpu" && currentPlayer === "O" && !isCpu) return;


      board[index] = currentPlayer;

      const winLine = checkWinner();
      if (winLine) {
        gameOver = true;
        winningCells = winLine;
        const winner = board[winLine[0]];
        setStatus(`Ha vinto: <b>${winner}</b> 🎉`);

        if (winner === "X") scoreX++;
        if (winner === "O") scoreO++;
        renderScore();

        render();
        return;
      }

      if (isDraw()) {
        gameOver = true;
        winningCells = [];
        setStatus(`Pareggio 😐 (nessuno ha vinto)`);

        scoreD++;
        renderScore();

        render();
        return;
      }

      currentPlayer = (currentPlayer === "X") ? "O" : "X";
      const label = (modeEl.value === "cpu") ? "CPU" : "PvP";
      setStatus(`Turno di: <b>${currentPlayer}</b> <span class="small">(Modalità: ${label})</span>`);
      render();

      doCpuMoveIfNeeded();
    }

    function resetGame() {
      board = Array(9).fill(null);
      currentPlayer = starterEl ? starterEl.value : "X";

      gameOver = false;
      winningCells = [];

      const label = (modeEl.value === "cpu") ? "CPU" : "PvP";
      setStatus(`Turno di: <b>${currentPlayer}</b> <span class="small">(Modalità: ${label})</span>`);
      render();
doCpuMoveIfNeeded();
starterEl.addEventListener("change", resetGame);


    }

    modeEl.addEventListener("change", resetGame);
    difficultyEl.addEventListener("change", resetGame);
    resetBtn.addEventListener("click", resetGame);

    // Avvio
    renderScore();
    resetGame();
  </script>
</body>
</html>
